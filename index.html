 <!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulyator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1e1e1e;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .calc {
    width: 320px;
    background: #2a2a2a;
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  #disp {
    width: 100%;
    height: 64px;
    font-size: 32px;
    text-align: right;
    padding: 0 16px;
    margin-bottom: 12px;
    border-radius: 12px;
    border: none;
    background: #1a1a1a;
    color: #fff;
  }
  #pad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  button {
    height: 58px;
    font-size: 20px;
    border-radius: 12px;
    border: none;
    background: #3a3a3a;
    color: #fff;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #484848; }
  button:active { transform: scale(0.97); }
  .op { background: #3b7dd8; }
  .op:hover { background: #4a8ae0; }
  .wide { grid-column: span 2; }
  h1 {
    text-align: center;
    color: #aaa;
    font-size: 15px;
    font-weight: 400;
    margin: 0 0 14px;
  }
</style>
</head>
<body>
<div class="calc">
  <h1>Kalkulyator</h1>
  <input id="disp" readonly value="0" />
  <div id="pad"></div>
</div>

<script>
const disp = document.getElementById('disp');
const pad = document.getElementById('pad');
const keys = ['C','±','%','÷','7','8','9','×','4','5','6','-','1','2','3','+','0','.','⌫','='];
let cur = '0', prev = null, op = null, reset = false;

function render(){ disp.value = cur; }

function press(k){
  if (k >= '0' && k <= '9') {
    if (cur === '0' || reset) { cur = k; reset = false; }
    else cur += k;
  } else if (k === '.') {
    if (reset) { cur = '0.'; reset = false; }
    else if (!cur.includes('.')) cur += '.';
  } else if (k === 'C') {
    cur = '0'; prev = null; op = null; reset = false;
  } else if (k === '⌫') {
    cur = cur.length > 1 ? cur.slice(0,-1) : '0';
  } else if (k === '±') {
    cur = (parseFloat(cur) * -1).toString();
  } else if (k === '%') {
    cur = (parseFloat(cur) / 100).toString();
  } else if (['+','-','×','÷'].includes(k)) {
    if (op && !reset) compute();
    prev = parseFloat(cur); op = k; reset = true;
  } else if (k === '=') {
    compute(); op = null;
  }
  render();
}

function compute(){
  if (prev === null || op === null) return;
  const a = prev, b = parseFloat(cur);
  let r;
  if (op === '+') r = a + b;
  else if (op === '-') r = a - b;
  else if (op === '×') r = a * b;
  else if (op === '÷') r = b === 0 ? NaN : a / b;
  cur = Math.round(r * 1e8) / 1e8;
  cur = cur.toString();
  prev = null; reset = true;
}

keys.forEach(k => {
  const btn = document.createElement('button');
  btn.textContent = k;
  if (k === '0') btn.classList.add('wide');
  if (['÷','×','-','+','='].includes(k)) btn.classList.add('op');
  btn.onclick = () => press(k);
  pad.appendChild(btn);
});
render();
</script>
</body>
</html>
