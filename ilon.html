<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ilon o'yini</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    background: linear-gradient(180deg, #1a2e1a 0%, #0d1a0d 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 24px 16px;
  }
  .wrap { width: 100%; max-width: 380px; }
  h2 {
    color: #fff;
    text-align: center;
    margin: 0 0 14px;
    font-size: 22px;
    font-weight: 600;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 14px;
    color: #9fd89f;
  }
  .hud b { color: #fff; font-size: 16px; }
  #restartBtn {
    display: none;
    background: linear-gradient(180deg, #4caf50, #388e3c);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
  }
  canvas {
    width: 100%;
    background: #16241a;
    border-radius: 16px;
    border: 2px solid #2e4a2e;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5), inset 0 0 40px rgba(0,0,0,0.3);
    touch-action: none;
    display: block;
  }
  .hint {
    font-size: 12px;
    color: #7a9a7a;
    margin-top: 8px;
    text-align: center;
  }
  .pad {
    display: grid;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(2, 44px);
    gap: 6px;
    justify-content: center;
    margin-top: 12px;
  }
  .pad button {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
  }
  .pad button:active { background: rgba(255,255,255,0.2); }
  #up { grid-column: 2; grid-row: 1; }
  #left { grid-column: 1; grid-row: 2; }
  #down { grid-column: 2; grid-row: 2; }
  #right { grid-column: 3; grid-row: 2; }
</style>
</head>
<body>
<div class="wrap">
  <h2>Ilon o'yini</h2>
  <div class="hud">
    <span>Hisob: <b id="score">0</b></span>
    <span>Eng yaxshi: <b id="best">0</b></span>
    <button id="restartBtn">Qayta boshlash</button>
  </div>
  <canvas id="game" width="340" height="340"></canvas>
  <p class="hint">Strelka yoki WASD bilan boshqaring</p>
  <div class="pad">
    <button id="up">^</button>
    <button id="left"><</button>
    <button id="down">v</button>
    <button id="right">></button>
  </div>
</div>

let snake, dir, nextDir, food, score, best, gameOver, tickTimer;
best = parseInt(localStorage.getItem('snake_best') || '0');
bestEl.textContent = best;

function placeFood(){
  let fx, fy, ok;
  do {
    ok = true;
    fx = Math.floor(Math.random()*GRID);
    fy = Math.floor(Math.random()*GRID);
    for (const s of snake) if (s.x===fx && s.y===fy) ok=false;
  } while(!ok);
  food = {x:fx, y:fy, pulse:0};
}

function reset(){
  snake = [{x:8,y:8},{x:7,y:8},{x:6,y:8}];
  dir = {x:1,y:0};
  nextDir = {x:1,y:0};
  score = 0;
  gameOver = false;
  scoreEl.textContent = 0;
  restartBtn.style.display = 'none';
  placeFood();
  if (tickTimer) clearInterval(tickTimer);
  tickTimer = setInterval(tick, 120);
  draw();
}

function tick(){
  if (gameOver) return;
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  if (head.x<0||head.x>=GRID||head.y<0||head.y>=GRID || snake.some(s=>s.x===head.x&&s.y===head.y)){
    endGame();
    return;
  }

  snake.unshift(head);

  if (head.x===food.x && head.y===food.y){
    score += 10;
    scoreEl.textContent = score;
    placeFood();
  } else {
    snake.pop();
  }

  draw();
}

function endGame(){
  gameOver = true;
  clearInterval(tickTimer);
  if (score > best){
    best = score;
    bestEl.textContent = best;
    localStorage.setItem('snake_best', best);
  }
  restartBtn.style.display = 'inline-block';
  draw();
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText("O'yin tugadi", W/2, H/2-10);
  ctx.font = '15px sans-serif';
  ctx.fillText('Hisob: '+score, W/2, H/2+18);
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function draw(){
  ctx.clearRect(0,0,W,H);

  for (let i=0;i<GRID;i++){
    for (let j=0;j<GRID;j++){
      if ((i+j)%2===0){
        ctx.fillStyle = 'rgba(255,255,255,0.02)';
        ctx.fillRect(i*CELL, j*CELL, CELL, CELL);
      }
    }
  }

  food.pulse = (food.pulse + 0.15) % (Math.PI*2);
  const pr = CELL/2 - 3 + Math.sin(food.pulse)*1.5;
  const fx = food.x*CELL + CELL/2, fy = food.y*CELL + CELL/2;
  const grad = ctx.createRadialGradient(fx,fy,0,fx,fy,pr);
  grad.addColorStop(0, '#ff6b6b');
  grad.addColorStop(1, '#c0392b');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(fx, fy, pr, 0, Math.PI*2);
  ctx.fill();

  for (let i=snake.length-1; i>=1; i--){
    const s = snake[i];
    const t = i/snake.length;
    const g = Math.floor(160 - t*60);
    ctx.fillStyle = 'rgb(' + Math.floor(40+t*20) + ',' + g + ',' + Math.floor(60+t*20) + ')';
    roundRect(s.x*CELL+2, s.y*CELL+2, CELL-4, CELL-4, 6);
    ctx.fill();
  }

  const head = snake[0];
  const hx = head.x*CELL, hy = head.y*CELL;
  ctx.save();
  roundRect(hx+1, hy+1, CELL-2, CELL-2, 8);
  ctx.clip();
  if (headImg.complete && headImg.naturalWidth > 0){
    ctx.drawImage(headImg, hx, hy, CELL, CELL);
  } else {
    ctx.fillStyle = '#4caf50';
    ctx.fillRect(hx, hy, CELL, CELL);
  }
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 1.5;
  roundRect(hx+1, hy+1, CELL-2, CELL-2, 8);
  ctx.stroke();
}

function setDir(nx, ny){
  if (dir.x === -nx && dir.y === -ny) return;
  nextDir = {x:nx, y:ny};
}

window.addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if (k==='arrowup'||k==='w') setDir(0,-1);
  else if (k==='arrowdown'||k==='s') setDir(0,1);
  else if (k==='arrowleft'||k==='a') setDir(-1,0);
  else if (k==='arrowright'||k==='d') setDir(1,0);
});

document.getElementById('up').onclick = ()=>setDir(0,-1);
document.getElementById('down').onclick = ()=>setDir(0,1);
document.getElementById('left').onclick = ()=>setDir(-1,0);
document.getElementById('right').onclick = ()=>setDir(1,0);

let touchStartX=0, touchStartY=0;
canvas.addEventListener('touchstart', e=>{
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, {passive:true});
canvas.addEventListener('touchend', e=>{
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy)){
    setDir(dx>0?1:-1, 0);
  } else {
    setDir(0, dy>0?1:-1);
  }
}, {passive:true});

restartBtn.onclick = reset;
headImg.onload = () => draw();
reset();
</script>
