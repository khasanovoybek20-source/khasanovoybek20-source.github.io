<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Otishma o'yini</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    background: #1e1e1e;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 24px 16px;
  }
  .wrap {
    width: 100%;
    max-width: 380px;
  }
  h2 {
    color: #fff;
    text-align: center;
    margin: 0 0 14px;
    font-size: 20px;
    font-weight: 500;
  }
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 14px;
    color: #aaa;
  }
  .hud b { color: #fff; }
  #restartBtn {
    display: none;
    background: #3a3a3a;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  canvas {
    width: 100%;
    background: #2a2a2a;
    border-radius: 14px;
    border: 1px solid #3a3a3a;
    touch-action: none;
    display: block;
  }
  .hint {
    font-size: 12px;
    color: #888;
    margin-top: 8px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">
  <h2>🚀 Otishma o'yini</h2>
  <div class="hud">
    <span>Hisob: <b id="score">0</b></span>
    <span>Jon: <b id="lives">3</b></span>
    <button id="restartBtn">Qayta boshlash</button>
  </div>
  <canvas id="game" width="340" height="420"></canvas>
  <p class="hint">Sichqoncha yoki barmoq bilan harakatlantiring, avtomatik otadi</p>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const restartBtn = document.getElementById('restartBtn');

let W = canvas.width, H = canvas.height;
let player = { x: W/2, y: H-30, w: 28, h: 16 };
let bullets = [];
let enemies = [];
let score = 0, lives = 3, gameOver = false;
let lastShot = 0, lastSpawn = 0;

function spawnEnemy(){
  const x = 20 + Math.random() * (W - 40);
  enemies.push({ x, y: -20, w: 22, h: 22, speed: 1 + Math.random()*1.2 });
}

function update(ts){
  if (gameOver) return;
  ctx.clearRect(0,0,W,H);

  if (ts - lastSpawn > 800) { spawnEnemy(); lastSpawn = ts; }
  if (ts - lastShot > 260) { bullets.push({x: player.x, y: player.y - 10}); lastShot = ts; }

  bullets.forEach(b => b.y -= 6);
  bullets = bullets.filter(b => b.y > -10);

  enemies.forEach(e => e.y += e.speed);
  enemies = enemies.filter(e => {
    if (e.y > H + 20) { lives--; livesEl.textContent = lives; return false; }
    return true;
  });

  for (let i = enemies.length - 1; i >= 0; i--) {
    for (let j = bullets.length - 1; j >= 0; j--) {
      const e = enemies[i], b = bullets[j];
      if (Math.abs(e.x - b.x) < e.w/2 + 3 && Math.abs(e.y - b.y) < e.h/2 + 6) {
        enemies.splice(i,1);
        bullets.splice(j,1);
        score += 10;
        scoreEl.textContent = score;
        break;
      }
    }
  }

  ctx.fillStyle = '#378ADD';
  bullets.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI*2); ctx.fill(); });

  ctx.fillStyle = '#D85A30';
  enemies.forEach(e => { ctx.fillRect(e.x - e.w/2, e.y - e.h/2, e.w, e.h); });

  ctx.fillStyle = '#7F77DD';
  ctx.beginPath();
  ctx.moveTo(player.x, player.y - player.h/2);
  ctx.lineTo(player.x - player.w/2, player.y + player.h/2);
  ctx.lineTo(player.x + player.w/2, player.y + player.h/2);
  ctx.closePath();
  ctx.fill();

  if (lives <= 0) {
    gameOver = true;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#fff';
    ctx.font = '20px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText("O'yin tugadi", W/2, H/2 - 10);
    ctx.font = '14px sans-serif';
    ctx.fillText('Hisob: ' + score, W/2, H/2 + 16);
    restartBtn.style.display = 'inline-block';
    return;
  }

  requestAnimationFrame(update);
}

function setPlayerX(clientX){
  const rect = canvas.getBoundingClientRect();
  const scale = W / rect.width;
  let x = (clientX - rect.left) * scale;
  x = Math.max(player.w/2, Math.min(W - player.w/2, x));
  player.x = x;
}

canvas.addEventListener('mousemove', e => setPlayerX(e.clientX));
canvas.addEventListener('touchmove', e => { e.preventDefault(); setPlayerX(e.touches[0].clientX); }, {passive:false});

function startGame(){
  bullets = []; enemies = []; score = 0; lives = 3; gameOver = false;
  scoreEl.textContent = 0; livesEl.textContent = 3;
  restartBtn.style.display = 'none';
  lastShot = 0; lastSpawn = 0;
  requestAnimationFrame(update);
}

restartBtn.onclick = startGame;
startGame();
</script>
</body>
</html>
