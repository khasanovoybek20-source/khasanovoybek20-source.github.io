<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sakrash o'yini</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    background: linear-gradient(180deg, #2c3e6b 0%, #1a2340 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 24px 16px;
  }
  .wrap { width: 100%; max-width: 380px; }
  h2 {
    color: #fff;
    text-align: center;
    margin: 0 0 14px;
    font-size: 22px;
    font-weight: 600;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 13px;
    color: #b8c4e8;
    flex-wrap: wrap;
    gap: 4px;
  }
  .hud b { color: #fff; font-size: 15px; }
  #restartBtn {
    display: none;
    background: linear-gradient(180deg, #f4a940, #d4870f);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
  }
  canvas {
    width: 100%;
    background: linear-gradient(180deg, #87ceeb 0%, #b8e2f0 100%);
    border-radius: 16px;
    border: 2px solid #2e4a7a;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    touch-action: none;
    display: block;
  }
  .hint {
    font-size: 12px;
    color: #9aa8d0;
    margin-top: 8px;
    text-align: center;
  }
  .controls {
    display: flex;
    justify-content: space-between;
    margin-top: 12px;
  }
  .dpad { display: flex; gap: 8px; }
  .controls button {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    color: #fff;
    font-size: 20px;
    width: 56px;
    height: 48px;
    cursor: pointer;
  }
  .controls button:active { background: rgba(255,255,255,0.25); }
  #jumpBtn {
    background: linear-gradient(180deg, #f4a940, #d4870f);
    width: 72px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h2>Sakrash o'yini</h2>
  <div class="hud">
    <span>Level: <b id="level">1</b>/5</span>
    <span>Tangalar: <b id="coins">0</b></span>
    <span>Jon: <b id="lives">3</b></span>
    <button id="restartBtn">Qayta boshlash</button>
  </div>
  <canvas id="game" width="340" height="380"></canvas>
  <p class="hint">Strelka/WASD bilan yuring, Bo'shliq bilan sakrang, dushman ustiga tushing</p>
  <div class="controls">
    <div class="dpad">
      <button id="leftBtn"><</button>
      <button id="rightBtn">></button>
    </div>
    <button id="jumpBtn">^</button>
  </div>
</div>

const GRAVITY = 0.55;
const JUMP_FORCE = -11.5;
const BASE_MOVE_SPEED = 3.2;
const TOTAL_LEVELS = 5;

let player, platforms, coins, enemies, potions, flag, camX, coinCount, lives, level, gameOver, won, keys;
let speedBoostTimer = 0;
let sizeScale = 1;

function genLevel(lv){
  platforms = [];
  coins = [];
  enemies = [];
  potions = [];
  let x = 0;
  platforms.push({x:0, y:H-40, w:180, h:40});
  x = 180;
  const segCount = 9 + lv*2;
  const enemyChance = 0.22 + lv*0.05;

  if (lv < 5){
    for (let i=0; i<segCount; i++){
      const gap = 45 + Math.random()*35;
      const w = 65 + Math.random()*55;
      const y = H - 40 - Math.random()*(120 + lv*8);
      x += gap;
      platforms.push({x, y, w, h:16});
      if (Math.random() > 0.4){
        coins.push({x: x + w/2, y: y - 26, taken:false, r:9});
      }
      if (Math.random() < 0.12){
        potions.push({x: x + w/2, y: y - 26, taken:false, r:9});
      }
      if (Math.random() < enemyChance && w > 60){
        enemies.push({x: x + w/2 - 12, y: y - 26, w:26, h:26, baseX: x+10, range: Math.max(20, w-40), dir:1, speed: 0.6+lv*0.15, alive:true});
      }
      x += w;
    }
    x += 60;
    platforms.push({x, y:H-40, w:150, h:40});
  } else {
    for (let i=0; i<segCount; i++){
      const gap = 45 + Math.random()*35;
      const w = 65 + Math.random()*55;
      const y = H - 40 - Math.random()*(120 + lv*8);
      x += gap;
      platforms.push({x, y, w, h:16});
      if (Math.random() > 0.4){
        coins.push({x: x + w/2, y: y - 26, taken:false, r:9});
      }
      if (Math.random() < 0.12){
        potions.push({x: x + w/2, y: y - 26, taken:false, r:9});
      }
      if (Math.random() < enemyChance && w > 60){
        enemies.push({x: x + w/2 - 12, y: y - 26, w:26, h:26, baseX: x+10, range: Math.max(20, w-40), dir:1, speed: 0.6+lv*0.15, alive:true});
      }
      x += w;
    }
    x += 40;
    const flatStart = x;
    const flatLen = 260;
    platforms.push({x: flatStart, y:H-40, w: flatLen, h:40});
    x = flatStart + flatLen;

    const gapWidth = 78;
    const landingX = x + gapWidth;
    platforms.push({x: landingX, y:H-40, w: 140, h:40});
    x = landingX + 140;
  }

  flag = {x: x - 40, y: H-40-90, w:8, h:90};
}

function reset(){
  level = 1;
  lives = 3;
  coinCount = 0;
  won = false;
  sizeScale = 1;
  coinsEl.textContent = 0;
  livesEl.textContent = 3;
  levelEl.textContent = 1;
  restartBtn.style.display = 'none';
  startLevel();
}

function startLevel(){
  if (level === 3) sizeScale = 1.35; else if (level < 3) sizeScale = 1;
  const pw = 30 * sizeScale, ph = 30 * sizeScale;
  player = {x:40, y:H-40-ph, w:pw, h:ph, vx:0, vy:0, onGround:false, facing:1};
  camX = 0;
  gameOver = false;
  keys = {};
  speedBoostTimer = 0;
  genLevel(level);
  requestAnimationFrame(loop);
}

function rectsOverlap(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

function respawnOnLevel(){
  player.x = 40;
  player.y = H-40-player.h;
  player.vx = 0; player.vy = 0;
  camX = 0;
  speedBoostTimer = 0;
}

function loop(){
  if (gameOver) return;
  ctx.clearRect(0,0,W,H);

  const moveSpeed = speedBoostTimer > 0 ? BASE_MOVE_SPEED * 1.8 : BASE_MOVE_SPEED;
  if (speedBoostTimer > 0) speedBoostTimer -= 1;

  if (keys['a']||keys['arrowleft']){ player.vx = -moveSpeed; player.facing=-1; }
  else if (keys['d']||keys['arrowright']){ player.vx = moveSpeed; player.facing=1; }
  else { player.vx *= 0.7; }

  if ((keys['w']||keys['arrowup']||keys[' ']) && player.onGround){
    player.vy = JUMP_FORCE;
    player.onGround = false;
  }

  player.vy += GRAVITY;
  player.x += player.vx;
  player.y += player.vy;
  player.onGround = false;

  for (const p of platforms){
    const pRect = {x:p.x, y:p.y, w:p.w, h:p.h};
    const pl = {x:player.x, y:player.y, w:player.w, h:player.h};
    if (rectsOverlap(pl, pRect)){
      const prevBottom = player.y + player.h - player.vy;
      if (prevBottom <= p.y + 2 && player.vy >= 0){
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
      }
    }
  }

  for (const e of enemies){
    if (!e.alive) continue;
    e.x += e.speed * e.dir;
    if (e.x < e.baseX || e.x > e.baseX + e.range) e.dir *= -1;
  }

  for (const e of enemies){
    if (!e.alive) continue;
    const eRect = {x:e.x, y:e.y, w:e.w, h:e.h};
    const pl = {x:player.x, y:player.y, w:player.w, h:player.h};
    if (rectsOverlap(pl, eRect)){
      const prevBottom = player.y + player.h - player.vy;
      if (player.vy > 0 && prevBottom <= e.y + 8){
        e.alive = false;
        player.vy = JUMP_FORCE * 0.6;
        coinCount += 5;
        coinsEl.textContent = coinCount;
      } else {
        loseLife();
        return;
      }
    }
  }

  if (player.y > H + 100){
    loseLife();
    return;
  }

  for (const c of coins){
    if (!c.taken){
      const dx = (player.x+player.w/2) - c.x;
      const dy = (player.y+player.h/2) - c.y;
      if (Math.hypot(dx,dy) < c.r + 16){
        c.taken = true;
        coinCount += 1;
        coinsEl.textContent = coinCount;
      }
    }
  }

  for (const po of potions){
    if (!po.taken){
      const dx = (player.x+player.w/2) - po.x;
      const dy = (player.y+player.h/2) - po.y;
      if (Math.hypot(dx,dy) < po.r + 16){
        po.taken = true;
        speedBoostTimer = 240;
      }
    }
  }

  if (player.x + player.w > flag.x - 10 && player.x < flag.x + 20 && Math.abs((player.y+player.h) - (flag.y+flag.h)) < 60){
    nextLevel();
    return;
  }

  const targetCam = player.x - W*0.35;
  camX += (targetCam - camX) * 0.12;
  if (camX < 0) camX = 0;

  ctx.save();
  ctx.translate(-camX, 0);

  ctx.fillStyle = '#5b9e3f';
  for (const p of platforms){
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = '#7ec25a';
    ctx.fillRect(p.x, p.y, p.w, 5);
    ctx.fillStyle = '#5b9e3f';
  }

  ctx.fillStyle = '#8b5a2b';
  ctx.fillRect(flag.x, flag.y, 3, flag.h);
  ctx.fillStyle = '#e24b4a';
  ctx.beginPath();
  ctx.moveTo(flag.x+3, flag.y+4);
  ctx.lineTo(flag.x+3+28, flag.y+14);
  ctx.lineTo(flag.x+3, flag.y+24);
  ctx.closePath();
  ctx.fill();

  for (const c of coins){
    if (c.taken) continue;
    const grad = ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,c.r);
    grad.addColorStop(0, '#fff3b0');
    grad.addColorStop(1, '#f4c430');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.r, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#d4a017';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  for (const po of potions){
    if (po.taken) continue;
    ctx.fillStyle = '#a56bd6';
    ctx.beginPath();
    ctx.moveTo(po.x-5, po.y-9);
    ctx.lineTo(po.x+5, po.y-9);
    ctx.lineTo(po.x+5, po.y-3);
    ctx.lineTo(po.x+8, po.y+9);
    ctx.lineTo(po.x-8, po.y+9);
    ctx.lineTo(po.x-5, po.y-3);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#6b3f94';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.fillStyle = '#3d2050';
    ctx.fillRect(po.x-3, po.y-12, 6, 4);
  }

  for (const e of enemies){
    if (!e.alive) continue;
    if (enemyImg.complete && enemyImg.naturalWidth > 0){
      ctx.save();
      if (e.dir < 0) { ctx.translate(e.x+e.w, e.y); ctx.scale(-1,1); ctx.drawImage(enemyImg, 0, 0, e.w, e.h); }
      else { ctx.drawImage(enemyImg, e.x, e.y, e.w, e.h); }
      ctx.restore();
    } else {
      ctx.fillStyle = '#8b5a2b';
      ctx.fillRect(e.x, e.y, e.w, e.h);
    }
  }

  ctx.save();
  ctx.translate(player.x + player.w/2, player.y + player.h/2);
  if (player.facing < 0) ctx.scale(-1,1);
  if (speedBoostTimer > 0){
    ctx.shadowColor = '#a56bd6';
    ctx.shadowBlur = 12;
  }
  if (heroImg.complete && heroImg.naturalWidth > 0){
    ctx.drawImage(heroImg, -player.w/2, -player.h/2, player.w, player.h);
  } else {
    ctx.fillStyle = '#e07a3f';
    ctx.fillRect(-player.w/2, -player.h/2, player.w, player.h);
  }
  ctx.restore();

  ctx.restore();

  requestAnimationFrame(loop);
}

function loseLife(){
  lives -= 1;
  livesEl.textContent = lives;
  if (lives <= 0){
    endGame(false);
  } else {
    respawnOnLevel();
    requestAnimationFrame(loop);
  }
}

function nextLevel(){
  if (level >= TOTAL_LEVELS){
    endGame(true);
  } else {
    level += 1;
    levelEl.textContent = level;
    startLevel();
  }
}

function endGame(didWin){
  gameOver = true;
  won = didWin;
  restartBtn.style.display = 'inline-block';
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'center';
  if (didWin){
    ctx.fillText("G'alaba!", W/2, H/2-10);
  } else {
    ctx.fillText("O'yin tugadi", W/2, H/2-10);
  }
  ctx.font = '15px sans-serif';
  ctx.fillText('Tangalar: '+coinCount, W/2, H/2+18);
}

window.addEventListener('keydown', e=>{ keys[e.key.toLowerCase()]=true; });
window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()]=false; });

function bindBtn(id, key){
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e=>{ e.preventDefault(); keys[key]=true; }, {passive:false});
  el.addEventListener('touchend', e=>{ e.preventDefault(); keys[key]=false; }, {passive:false});
  el.addEventListener('mousedown', ()=>{ keys[key]=true; });
  el.addEventListener('mouseup', ()=>{ keys[key]=false; });
  el.addEventListener('mouseleave', ()=>{ keys[key]=false; });
}
bindBtn('leftBtn','a');
bindBtn('rightBtn','d');
bindBtn('jumpBtn',' ');

restartBtn.onclick = reset;
reset();
</script>
</body>
</html>
