<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arena o'yini</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    background: #1e1e1e;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    padding: 24px 16px;
  }
  .wrap { width: 100%; max-width: 380px; }
  h2 {
    color: #fff;
    text-align: center;
    margin: 0 0 14px;
    font-size: 20px;
    font-weight: 500;
  }
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 14px;
    color: #aaa;
  }
  .hud b { color: #fff; }
  #restartBtn {
    display: none;
    background: #3a3a3a;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  canvas {
    width: 100%;
    background: #2a2a2a;
    border-radius: 14px;
    border: 1px solid #3a3a3a;
    touch-action: none;
    display: block;
  }
  .hint {
    font-size: 12px;
    color: #888;
    margin-top: 8px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">
  <h2>🎯 Arena o'yini</h2>
  <div class="hud">
    <span>Hisob: <b id="score">0</b></span>
    <span>Jon: <b id="hp">100</b></span>
    <button id="restartBtn">Qayta boshlash</button>
  </div>
  <canvas id="game" width="340" height="420"></canvas>
  <p class="hint">WASD/strelka bilan yuring, bosib turib mo'ljal oling</p>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const hpEl = document.getElementById('hp');
const restartBtn = document.getElementById('restartBtn');
const W = canvas.width, H = canvas.height;

let player, bullets, enemies, score, hp, gameOver, keys, lastSpawn, aimX, aimY, dragging, shootTimer;

function reset(){
  player = { x: W/2, y: H/2, r: 10, speed: 2.2 };
  bullets = []; enemies = []; score = 0; hp = 100; gameOver = false;
  keys = {}; lastSpawn = 0; aimX = player.x; aimY = player.y - 20; dragging = false; shootTimer = 0;
  scoreEl.textContent = 0; hpEl.textContent = 100;
  restartBtn.style.display = 'none';
  requestAnimationFrame(loop);
}

function spawnEnemy(){
  const side = Math.floor(Math.random()*4);
  let x,y;
  if (side===0){ x=Math.random()*W; y=-20; }
  else if (side===1){ x=Math.random()*W; y=H+20; }
  else if (side===2){ x=-20; y=Math.random()*H; }
  else { x=W+20; y=Math.random()*H; }
  enemies.push({x,y,r:11,speed:0.7+Math.random()*0.6});
}

function loop(ts){
  if (gameOver) return;
  ctx.clearRect(0,0,W,H);

  let dx=0, dy=0;
  if (keys['w']||keys['arrowup']) dy-=1;
  if (keys['s']||keys['arrowdown']) dy+=1;
  if (keys['a']||keys['arrowleft']) dx-=1;
  if (keys['d']||keys['arrowright']) dx+=1;
  const len = Math.hypot(dx,dy);
  if (len>0){ player.x += dx/len*player.speed; player.y += dy/len*player.speed; }
  player.x = Math.max(player.r, Math.min(W-player.r, player.x));
  player.y = Math.max(player.r, Math.min(H-player.r, player.y));

  if (ts - lastSpawn > 900) { spawnEnemy(); lastSpawn = ts; }

  shootTimer += 16;
  if (shootTimer > 300){
    const ang = Math.atan2(aimY-player.y, aimX-player.x);
    bullets.push({x:player.x,y:player.y,vx:Math.cos(ang)*5,vy:Math.sin(ang)*5});
    shootTimer = 0;
  }

  bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;});
  bullets = bullets.filter(b=>b.x>-10&&b.x<W+10&&b.y>-10&&b.y<H+10);

  enemies.forEach(e=>{
    const ang = Math.atan2(player.y-e.y, player.x-e.x);
    e.x += Math.cos(ang)*e.speed;
    e.y += Math.sin(ang)*e.speed;
  });

  for (let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    if (Math.hypot(e.x-player.x, e.y-player.y) < e.r+player.r){
      enemies.splice(i,1);
      hp -= 15;
      hpEl.textContent = Math.max(0,hp);
      continue;
    }
    for (let j=bullets.length-1;j>=0;j--){
      const b = bullets[j];
      if (Math.hypot(e.x-b.x, e.y-b.y) < e.r+3){
        enemies.splice(i,1);
        bullets.splice(j,1);
        score += 10;
        scoreEl.textContent = score;
        break;
      }
    }
  }

  ctx.fillStyle = '#F0997B';
  enemies.forEach(e=>{ ctx.beginPath(); ctx.arc(e.x,e.y,e.r,0,Math.PI*2); ctx.fill(); });

  ctx.fillStyle = '#378ADD';
  bullets.forEach(b=>{ ctx.beginPath(); ctx.arc(b.x,b.y,3,0,Math.PI*2); ctx.fill(); });

  ctx.fillStyle = '#7F77DD';
  ctx.beginPath(); ctx.arc(player.x,player.y,player.r,0,Math.PI*2); ctx.fill();
  const ang2 = Math.atan2(aimY-player.y, aimX-player.x);
  ctx.strokeStyle = '#7F77DD';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(player.x,player.y);
  ctx.lineTo(player.x+Math.cos(ang2)*16, player.y+Math.sin(ang2)*16);
  ctx.stroke();

  if (hp<=0){
    gameOver = true;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#fff';
    ctx.font = '20px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText("O'yin tugadi", W/2, H/2-10);
    ctx.font = '14px sans-serif';
    ctx.fillText('Hisob: '+score, W/2, H/2+16);
    restartBtn.style.display = 'inline-block';
    return;
  }

  requestAnimationFrame(loop);
}

window.addEventListener('keydown', e=>{ keys[e.key.toLowerCase()]=true; });
window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()]=false; });

function setAim(clientX, clientY){
  const rect = canvas.getBoundingClientRect();
  const scale = W/rect.width;
  aimX = (clientX-rect.left)*scale;
  aimY = (clientY-rect.top)*scale;
}

canvas.addEventListener('mousedown', e=>{ dragging=true; setAim(e.clientX,e.clientY); });
window.addEventListener('mousemove', e=>{ if(dragging) setAim(e.clientX,e.clientY); });
window.addEventListener('mouseup', ()=>{ dragging=false; });

canvas.addEventListener('touchstart', e=>{ dragging=true; setAim(e.touches[0].clientX,e.touches[0].clientY); }, {passive:true});
canvas.addEventListener('touchmove', e=>{ e.preventDefault(); setAim(e.touches[0].clientX,e.touches[0].clientY); }, {passive:false});
canvas.addEventListener('touchend', ()=>{ dragging=false; });

restartBtn.onclick = reset;
reset();
</script>
</body>
</html>
